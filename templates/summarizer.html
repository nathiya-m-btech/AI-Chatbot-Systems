<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Summarizer • IntelliChat Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:#020617;
    color:white;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.card{
    width:100%;
    max-width:900px;
    background:rgba(15,23,42,0.85);
    border-radius:25px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.08);
}

textarea{
    width:100%;
    height:200px;
    padding:15px;
    border-radius:12px;
    border:none;
    outline:none;
    margin-top:15px;
    font-family:Poppins;
    background:#0f172a;
    color:white;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    background:linear-gradient(to right,#2563eb,#38bdf8);
    color:white;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

#result{
    margin-top:20px;
    background:#0f172a;
    padding:20px;
    border-radius:15px;
    min-height:80px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="main">

<div class="card">

<h1>AI Summarizer</h1>
<p>Paste text and get short summary</p>

<textarea id="text" placeholder="Enter text here"></textarea>

<button onclick="summarizeText()">Summarize</button>

<div id="result">Summary will appear here</div>

</div>

</div>

<script>

async function summarizeText(){

    let text = document.getElementById("text").value;

    if(!text){
        alert("Enter text first");
        return;
    }

    document.getElementById("result").innerHTML = "Summarizing...";

    let res = await fetch("/summarize",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            text:text
        })
    });

    let data = await res.json();

    document.getElementById("result").innerHTML = data.summary;
}

</script>

</body>
</html>
