<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Coding Assistant • IntelliChat Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:#020617;
    color:white;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.card{
    width:100%;
    max-width:900px;
    background:rgba(15,23,42,0.85);
    border-radius:25px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.08);
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    border-radius:15px;
    border:none;
    outline:none;
    font-family:monospace;
    background:#0f172a;
    color:white;
    margin-top:15px;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    background:linear-gradient(to right,#2563eb,#38bdf8);
    color:white;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    background:#0f172a;
    padding:20px;
    border-radius:15px;
    min-height:120px;
    font-family:monospace;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="main">

<div class="card">

<h1>💻 AI Coding Assistant</h1>
<p>Get clean code output only</p>

<textarea id="question" placeholder="Write your coding problem here"></textarea>

<button onclick="askAI()">Generate Code</button>

<div id="result">Code will appear here</div>

</div>

</div>

<script>

function extractCode(text){

    let match = text.match(/```([\s\S]*?)```/);

    if(match){
        return match[1];
    }

    return text;
}

async function askAI(){

    let question = document.getElementById("question").value;

    if(!question){
        alert("Enter your coding question");
        return;
    }

    document.getElementById("result").innerHTML =
        "Generating code...";

    try{

        let res = await fetch("/codingbot",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:question
            })
        });

        let data = await res.json();

        let codeOnly = extractCode(data.response);

        document.getElementById("result").innerHTML =
            `<pre>${codeOnly}</pre>`;

    }catch(err){

        document.getElementById("result").innerHTML =
            "Error connecting to server";
    }
}

</script>

</body>
</html>
