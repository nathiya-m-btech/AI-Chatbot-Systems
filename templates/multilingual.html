<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multilingual AI Translator • IntelliChat Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:#020617;
    color:white;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.card{
    width:100%;
    max-width:900px;
    background:rgba(15,23,42,0.85);
    border-radius:25px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.08);
}

textarea, select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    outline:none;
    margin-top:15px;
    font-family:Poppins;
}

textarea{
    height:140px;
    background:#0f172a;
    color:white;
}

select{
    background:#0f172a;
    color:white;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    background:linear-gradient(to right,#2563eb,#38bdf8);
    color:white;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

#result{
    margin-top:20px;
    background:#0f172a;
    padding:20px;
    border-radius:15px;
    min-height:80px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="main">

<div class="card">

<h1>🌐 Multilingual AI Translator</h1>
<p>Translate text into 10+ languages using AI</p>

<textarea id="text" placeholder="Enter text here"></textarea>

<select id="language">

    <option value="Tamil">Tamil</option>
    <option value="Hindi">Hindi</option>
    <option value="English">English</option>
    <option value="French">French</option>
    <option value="German">German</option>
    <option value="Spanish">Spanish</option>
    <option value="Japanese">Japanese</option>

    <option value="Chinese (Simplified)">Chinese (Simplified)</option>
    <option value="Chinese (Traditional)">Chinese (Traditional)</option>
    <option value="Korean">Korean</option>
    <option value="Arabic">Arabic</option>
    <option value="Russian">Russian</option>
    <option value="Italian">Italian</option>
    <option value="Portuguese">Portuguese</option>
    <option value="Dutch">Dutch</option>
    <option value="Malay">Malay</option>
    <option value="Thai">Thai</option>

</select>

<button onclick="translateText()">Translate</button>

<div id="result">Translated text will appear here</div>

</div>

</div>

<script>

async function translateText(){

    let text = document.getElementById("text").value;
    let language = document.getElementById("language").value;

    if(!text){
        alert("Enter text first");
        return;
    }

    document.getElementById("result").innerHTML = "Translating...";

    let res = await fetch("/translate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            text:text,
            language:language
        })
    });

    let data = await res.json();

    document.getElementById("result").innerHTML = data.translated_text;
}

</script>

</body>
</html>
